<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — AgroSentinel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a class="brand" href="/">
      <span class="brand-mark">🛰️</span> AgroSentinel
    </a>
    <h1>Welcome back</h1>
    <p class="sub">Log in to view your saved fields and monitoring history.</p>

    <div class="auth-error" id="authError"></div>

    <form class="auth-form" id="loginForm">
      <div class="field-group">
        <label>Email</label>
        <input type="email" id="email" required autocomplete="email" placeholder="you@farm.com">
      </div>
      <div class="field-group">
        <label>Password</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">Log In</button>
    </form>

    <p class="auth-switch">New to AgroSentinel? <a href="/register">Create an account</a></p>
  </div>
</div>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
