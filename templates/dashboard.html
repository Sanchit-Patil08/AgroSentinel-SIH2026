<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Fields — AgroSentinel</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="app-nav">
  <a class="brand" href="/">
    <span class="brand-mark">🛰️</span> AgroSentinel
  </a>
  <div class="user-chip">
    <span class="user-avatar">{{ current_user.name[:1].upper() }}</span>
    <span>{{ current_user.name }}</span>
    <a class="btn btn-ghost btn-sm" href="/logout">Log Out</a>
  </div>
</div>

<div class="container section">
  <div class="dash-header">
    <div>
      <h1>My Fields</h1>
      <p>Saved fields and their most recent health status.</p>
    </div>
    <a class="btn btn-primary" href="/fields/new">+ Add Field</a>
  </div>

  <div class="field-grid" id="fieldGrid">
    <div class="empty-state">Loading your fields…</div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
